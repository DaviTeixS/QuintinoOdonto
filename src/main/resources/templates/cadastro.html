<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${tituloPagina}, null)}"></head>
<body class="app" th:data-base="@{/}">

  <!-- Usado em /cadastro (público, "Fazer cadastro") e em /colaboradores/novo (com a função) -->
  <header th:replace="~{fragments/layout :: topoVoltar(${tituloPagina}, ${voltar}, '')}"></header>

  <main class="conteudo">
    <th:block th:replace="~{fragments/layout :: mensagens}"></th:block>

    <form class="form form--coluna" th:action="@{${acao}}" method="post" data-envio-unico>
      <div class="campo">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" required minlength="3" maxlength="100" autocomplete="name" th:value="${v['nome']}">
      </div>

      <div class="campo" th:if="${mostrarFuncao}">
        <label for="funcao">Função</label>
        <select id="funcao" name="funcao" required>
          <option value="" th:selected="${v['funcao'] == null}" disabled>Selecione</option>
          <option value="DENTISTA" th:selected="${v['funcao'] == 'DENTISTA'}">Dentista</option>
          <option value="RECEPCIONISTA" th:selected="${v['funcao'] == 'RECEPCIONISTA'}">Recepcionista</option>
        </select>
      </div>

      <div class="campo">
        <label for="documento">CPF/CRO</label>
        <input id="documento" name="documento" type="text" required maxlength="30" data-mascara="documento"
               placeholder="000.000.000-00 ou CRO-SP 00000" th:value="${v['documento']}">
      </div>

      <div class="campo">
        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel" required inputmode="numeric" data-mascara="telefone"
               autocomplete="tel-national" placeholder="11 90000-0000" th:value="${v['telefone']}">
      </div>

      <div class="campo">
        <label for="nascimento">Data</label>
        <input id="nascimento" name="nascimento" type="date" required th:max="${hoje}" th:value="${v['nascimento']}">
        <p class="campo__dica">Data de nascimento</p>
      </div>

      <div class="campo">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required maxlength="120" autocomplete="email" th:value="${v['email']}">
      </div>

      <div class="campo">
        <label for="confirmaEmail">Confirmar email</label>
        <input id="confirmaEmail" name="confirmaEmail" type="email" required maxlength="120" autocomplete="off"
               data-confirma="#email" th:value="${v['confirmaEmail']}">
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" required minlength="6" maxlength="60" autocomplete="new-password">
        <p class="campo__dica">Mínimo de 6 caracteres</p>
      </div>

      <div class="campo">
        <label for="confirmaSenha">Confirmar senha</label>
        <input id="confirmaSenha" name="confirmaSenha" type="password" required minlength="6" maxlength="60"
               autocomplete="new-password" data-confirma="#senha">
      </div>

      <div class="form-acoes">
        <button type="submit" class="botao botao--primario">Confirmar</button>
        <a class="botao botao--secundario" th:href="@{${voltar}}">Cancelar</a>
      </div>
    </form>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
