<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pacientes', null)}"></head>
<body class="app" th:data-base="@{/}">

  <th:block th:replace="~{fragments/layout :: topo('Quintino Odonto')}"></th:block>

  <main class="conteudo conteudo--estreito">
    <th:block th:replace="~{fragments/layout :: mensagens}"></th:block>

    <form class="busca" role="search" onsubmit="return false">
      <label class="visualmente-oculto" for="busca">Buscar paciente pelo nome</label>
      <div class="busca__campo">
        <th:block th:replace="~{fragments/icones :: lupa}"></th:block>
        <input id="busca" type="search" placeholder="Informe o nome do paciente" autocomplete="off">
      </div>
    </form>

    <!-- Itens montados por /js/busca-lista.js a partir de /api/pacientes -->
    <section id="lista" class="lista" aria-live="polite"
             th:data-api="@{/api/pacientes}" th:data-base="@{/pacientes}"
             data-principal="true" data-vazio="Nenhum paciente encontrado."></section>

    <a class="botao-novo" th:href="@{/pacientes/novo}">+Novo Paciente</a>
  </main>

  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
  <script th:src="@{/js/busca-lista.js}" defer></script>
</body>
</html>
