spring.application.name=quintino-odonto
server.port=8080

# Banco H2 em memória: os dados somem quando a aplicação para.
# O DadosIniciais recria os dados de demonstração a cada inicialização.
spring.datasource.url=jdbc:h2:mem:quintino
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console do H2 para ver as tabelas em http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:quintino | usuário: sa | senha: vazia)
spring.h2.console.enabled=true

# Sessão de login expira após 30 minutos sem uso
server.servlet.session.timeout=30m

# Recarrega os templates sem reiniciar (desenvolvimento)
spring.thymeleaf.cache=false
