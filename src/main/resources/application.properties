spring.application.name=quintino-odonto
server.port=8080

# Banco h2 em memória, os dados somem quando o projeto para
spring.datasource.url=jdbc:h2:mem:quintino
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#console do h2 pra ver as telas em http://localhost:8080/h2-console
spring.h2.console.enabled=true

# ---------------------------------------------------------------
# FRONT-END: dados de mentira (service/mock) para as telas funcionarem sem o back-end.
# Quando o back real estiver pronto: apague esta linha e a pasta service/mock.
# ---------------------------------------------------------------
spring.profiles.active=mock

# Recarrega os templates sem reiniciar (desenvolvimento)
spring.thymeleaf.cache=false
